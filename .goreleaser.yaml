version: 2
project_name: organon

before:
  hooks:
    - go mod tidy

builds:
  - id: src
    binary: src
    main: ./cmd/src
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: skill
    binary: skill
    main: ./cmd/skill
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: goal
    binary: goal
    main: ./cmd/goal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: token
    binary: token
    main: ./cmd/token
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: og
    binary: og
    main: ./cmd/og
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: og-windows
    binary: og
    main: ./cmd/og
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64]

archives:
  - id: organon
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    ids:
      - src
      - skill
      - goal
      - token
      - og

  - id: og-windows
    formats: [zip]
    name_template: "{{ .ProjectName }}_Windows_x86_64_og"
    ids: [og-windows]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
