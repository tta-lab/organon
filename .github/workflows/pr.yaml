name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Download dependencies
        run: go mod download

      - name: Format
        run: |
          make fmt
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code not formatted. Run 'make fmt' and commit."
            git status --porcelain
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout=5m

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Install Pi workspace
        working-directory: pi
        run: pnpm install --frozen-lockfile

      - name: Pi format check
        working-directory: pi
        run: pnpm exec prettier --check .

      - name: Pi typecheck
        working-directory: pi
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Pi build
        working-directory: pi
        run: pnpm build

      - name: DSH Web rc.8 composition smoke
        working-directory: pi
        run: pnpm --filter @tta-lab/dsh-web run test:composition

      - name: Pi tests
        working-directory: pi
        run: pnpm exec vitest run

      - name: Pi release invariants
        working-directory: pi
        run: node scripts/test-release-invariants.mjs

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Install Pi workspace
        working-directory: pi
        run: pnpm install --frozen-lockfile

      - name: Build Pi extensions
        working-directory: pi
        run: pnpm build

      - name: Snapshot release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean

      - name: Stage native binaries and verify them
        working-directory: pi
        run: |
          node scripts/stage-natives.mjs ../dist
          for f in packages/native/pi-*/bin/*; do
            test -x "$f" || { echo "$f is not executable"; exit 1; }
          done
          echo "all native binaries present and executable"

      - name: Verify tag-to-artifact release invariants
        working-directory: pi
        run: node scripts/test-release-invariants.mjs ../dist

  windows-web:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2

      - name: Install Pi workspace
        working-directory: pi
        run: pnpm install --frozen-lockfile

      - name: Build Pi Web package
        working-directory: pi
        run: pnpm --filter @tta-lab/pi-web run build

      - name: Pack, install, and run resolved web.exe from paths with spaces
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "organon web smoke"
          $nativePackageRoot = Join-Path $env:RUNNER_TEMP "organon native package path"
          $nativePackRoot = Join-Path $smokeRoot "native"
          $mainPackRoot = Join-Path $smokeRoot "main"
          $installRoot = Join-Path $env:RUNNER_TEMP "organon installed web path"
          New-Item -ItemType Directory -Force (Join-Path $nativePackageRoot "bin") | Out-Null
          New-Item -ItemType Directory -Force $nativePackRoot | Out-Null
          New-Item -ItemType Directory -Force $mainPackRoot | Out-Null
          Copy-Item pi/packages/native/pi-web-win32-x64/package.json (Join-Path $nativePackageRoot "package.json")
          $env:CGO_ENABLED = "0"
          go build -o (Join-Path $nativePackageRoot "bin/web.exe") ./cmd/web
          Push-Location $nativePackageRoot
          npm pack --pack-destination $nativePackRoot | Out-Null
          Pop-Location
          Push-Location pi/packages/pi-web
          pnpm pack --pack-destination $mainPackRoot | Out-Null
          Pop-Location
          $nativeTarball = (Get-ChildItem $nativePackRoot -Filter "*.tgz").FullName
          $mainTarball = (Get-ChildItem $mainPackRoot -Filter "*.tgz").FullName
          New-Item -ItemType Directory -Force $installRoot | Out-Null
          $peerAi = "link:" + (Resolve-Path "pi/node_modules/@earendil-works/pi-ai").Path
          $peerAgent = "link:" + (Resolve-Path "pi/node_modules/@earendil-works/pi-coding-agent").Path
          $peerTypebox = "link:" + (Resolve-Path "pi/node_modules/typebox").Path
          Push-Location $installRoot
          pnpm add --offline --ignore-scripts --no-optional $mainTarball $nativeTarball $peerAi $peerAgent $peerTypebox
          Pop-Location
          "PI_WINDOWS_WEB_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test Windows Pi Web resolver and cache
        working-directory: pi
        run: pnpm exec vitest run packages/shared/test/windows-web.test.ts packages/shared/test/fetch.test.ts
